<svg xmlns="http://www.w3.org/2000/svg" width="560" height="192" viewBox="0 0 560 192" role="img" aria-label="Guesses are quarantined. Import-based names go in a separate section to check before you publish. Failures are visible. Anything it cannot trace is listed, not silently dropped. Public data only. GitHub handles and the display name someone chose to publish."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="316.3" height="102" rx="10"/></clipPath><rect width="316.3" height="102" rx="10" fill="url(#n)"/><rect width="316.3" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="315.3" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="160" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🧪 Guesses are quarantined</text><text x="160" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Import-based names go in a separate</text><text x="160" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">section to check before you publish.</text></g><g transform="translate(326.3,0)"><clipPath id="c0_1"><rect width="233.7" height="102" rx="10"/></clipPath><rect width="233.7" height="102" rx="10" fill="url(#n)"/><rect width="233.7" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="232.7" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="119" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">👀 Failures are visible</text><text x="119" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Anything it cannot trace is</text><text x="119" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">listed, not silently dropped.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a6a3a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🔓 Public data only</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">GitHub handles and the display name someone chose to publish.</text></g></g></svg>
