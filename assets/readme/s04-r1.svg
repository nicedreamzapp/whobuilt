<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Nothing to install. Python 3.12+, standard library only. Token optional. Uses GITHUB_TOKEN or GH_TOKEN, or borrows the one gh already has. Offline tests. Every registry and GitHub call is faked; the suite runs in under a second."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="218.2" height="133" rx="10"/></clipPath><rect width="218.2" height="133" rx="10" fill="url(#n)"/><rect width="218.2" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="217.2" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="111" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🐍 Nothing to</text><text x="111" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#cdd9cc">install</text><text x="111" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Python 3.12+,</text><text x="111" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">standard library only.</text></g><g transform="translate(230.2,0)"><clipPath id="c0_1"><rect width="288.9" height="133" rx="10"/></clipPath><rect width="288.9" height="133" rx="10" fill="url(#n)"/><rect width="288.9" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="287.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="146" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🔑 Token optional</text><text x="146" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Uses GITHUB_TOKEN or</text><text x="146" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">GH_TOKEN, or borrows the</text><text x="146" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">one gh already has.</text></g><g transform="translate(531.1,0)"><clipPath id="c0_2"><rect width="288.9" height="133" rx="10"/></clipPath><rect width="288.9" height="133" rx="10" fill="url(#n)"/><rect width="288.9" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="287.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="146" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">✅ Offline tests</text><text x="146" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Every registry and GitHub call</text><text x="146" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">is faked; the suite runs in under</text><text x="146" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">a second.</text></g></g></svg>
