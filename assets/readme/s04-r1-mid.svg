<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" role="img" aria-label="Nothing to install. Python 3.12+, standard library only. Token optional. Uses GITHUB_TOKEN or GH_TOKEN, or borrows the one gh already has. Offline tests. Every registry and GitHub call is faked; the suite runs in under a second."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="218.6" height="102" rx="10"/></clipPath><rect width="218.6" height="102" rx="10" fill="url(#n)"/><rect width="218.6" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="217.6" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="111" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🐍 Nothing to install</text><text x="111" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Python 3.12+, standard</text><text x="111" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">library only.</text></g><g transform="translate(228.6,0)"><clipPath id="c0_1"><rect width="331.4" height="102" rx="10"/></clipPath><rect width="331.4" height="102" rx="10" fill="url(#n)"/><rect width="331.4" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="330.4" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="168" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🔑 Token optional</text><text x="168" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Uses GITHUB_TOKEN or GH_TOKEN,</text><text x="168" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">or borrows the one gh already has.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#4f7a4a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">✅ Offline tests</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Every registry and GitHub call is faked; the suite runs in under a</text><text x="282" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">second.</text></g></g></svg>
