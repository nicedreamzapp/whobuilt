<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="Manifest scanner. Parses requirements, pyproject, package.json and Cargo.toml with no extra libraries. Resolver. Package to registry to GitHub repo to the top 4 human contributors, bots filtered out. CLI and renderer. Options, 8 parallel lookups, and the Markdown output."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="293.4" height="157" rx="10"/></clipPath><rect width="293.4" height="157" rx="10" fill="url(#n)"/><rect width="293.4" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="292.4" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🔎 Manifest scanner</text><text x="149" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Parses requirements, pyproject,</text><text x="149" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">package.json and Cargo.toml</text><text x="149" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">with no extra libraries.</text></g><g transform="translate(305.4,0)"><clipPath id="c0_1"><rect width="268.7" height="157" rx="10"/></clipPath><rect width="268.7" height="157" rx="10" fill="url(#n)"/><rect width="268.7" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="267.7" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="136" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🧭 Resolver</text><text x="136" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Package to registry to</text><text x="136" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">GitHub repo to the top 4</text><text x="136" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">human contributors, bots</text><text x="136" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">filtered out.</text></g><g transform="translate(586.2,0)"><clipPath id="c0_2"><rect width="233.8" height="157" rx="10"/></clipPath><rect width="233.8" height="157" rx="10" fill="url(#n)"/><rect width="233.8" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="232.8" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="119" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🖨️ CLI and renderer</text><text x="119" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Options, 8 parallel</text><text x="119" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">lookups, and the</text><text x="119" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Markdown output.</text></g></g></svg>
