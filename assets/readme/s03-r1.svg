<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Guesses are quarantined. Import-based names go in a separate section to check before you publish. Failures are visible. Anything it cannot trace is listed, not silently dropped. Public data only. GitHub handles and the display name someone chose to publish."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="307.6" height="133" rx="10"/></clipPath><rect width="307.6" height="133" rx="10" fill="url(#n)"/><rect width="307.6" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="306.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="156" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🧪 Guesses are quarantined</text><text x="156" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Import-based names go in a</text><text x="156" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">separate section to check before</text><text x="156" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">you publish.</text></g><g transform="translate(319.6,0)"><clipPath id="c0_1"><rect width="241.6" height="133" rx="10"/></clipPath><rect width="241.6" height="133" rx="10" fill="url(#n)"/><rect width="241.6" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="240.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="123" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">👀 Failures are visible</text><text x="123" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Anything it cannot trace is</text><text x="123" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">listed, not silently</text><text x="123" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">dropped.</text></g><g transform="translate(573.1,0)"><clipPath id="c0_2"><rect width="246.9" height="133" rx="10"/></clipPath><rect width="246.9" height="133" rx="10" fill="url(#n)"/><rect width="246.9" height="4" fill="#8a6a3a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="245.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="125" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🔓 Public data only</text><text x="125" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">GitHub handles and the</text><text x="125" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">display name someone</text><text x="125" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">chose to publish.</text></g></g></svg>
